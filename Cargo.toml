[workspace]
resolver = "3"   # MSRV-aware dependency resolution (needs Cargo >= 1.84)
members = ["crates/vault-core"]
exclude = ["src-tauri"]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"   # prevents accidental secret logging via println!
print_stderr = "deny"   # same for eprintln!

[profile.release]
overflow-checks = true
lto = true
codegen-units = 1
